[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aauth"
version = "0.1.0"
description = "Python SDK for the AAuth agent authentication/authorization protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brad Zeitner" }]
dependencies = [
    "cryptography>=42",
    "pyjwt>=2.8",
    "http-message-signatures>=2.0",
    "typing_extensions>=4.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "requests>=2.31"]

[tool.setuptools.packages.find]
include = ["aauth*"]
